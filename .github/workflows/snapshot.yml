name: Publish Snapshot
# Needs the CENTRAL_USERNAME / CENTRAL_PASSWORD secrets: a Sonatype Central Portal user token
# (https://central.sonatype.com/account), with SNAPSHOT publishing enabled for the io.github.dengliming namespace.
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  snapshot:
    name: Deploy Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up publishing to maven central
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: deploy
        run: |
          mvn --no-transfer-progress -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
