name: build

on:
  pull_request:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis-stack-server:
        image: redis/redis-stack-server:edge
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 52567:6379
      redisai:
        image: redislabs/redisai:edge-cpu-bionic
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 52568:6379
      redisgears:
        image: redislabs/redisgears:latest
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6383:6379
      redisgraph:
        image: redislabs/redisgraph:edge
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6384:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
      - name: Print Redis server versions
        run: |
          for c in $(docker ps -q); do
            echo "== $(docker inspect --format '{{.Config.Image}}' $c)"
            docker exec $c redis-cli INFO server | grep -E "redis_version|redis_mode" || true
            docker exec $c redis-cli MODULE LIST || true
            docker exec $c redis-cli CONFIG GET "search*" | head -40 || true
          done
      - name: Build with Maven
        run: mvn --fail-at-end clean install -DREDIS_HOST=localhost -DREDIS_PORT=52567 -DREDISAI_PORT=52568 -DREDIS_GEARS_PORT=6383 -DREDIS_GRAPH_PORT=6384 -Dgpg.skip --file pom.xml
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
